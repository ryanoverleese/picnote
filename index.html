<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Captioner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    #finalCanvas {
      display: block;
      max-width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    class ReceiptCaptioner {
      constructor() {
        this.selectedImage = null;
        this.caption = '';
        this.render();
        this.attachEventListeners();
      }

      render() {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
            <!-- Header -->
            <div class="border-b border-slate-200 bg-white/50 backdrop-blur-sm sticky top-0 z-40">
              <div class="max-w-2xl mx-auto px-6 py-6">
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
                  Receipt Captioner
                </h1>
                <p class="text-slate-600 mt-1 text-sm font-medium">
                  Add captions to your receipts
                </p>
              </div>
            </div>

            <!-- Main Content -->
            <div class="max-w-2xl mx-auto px-6 py-8">
              <div class="space-y-6">
                <!-- Image Upload Section -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <label class="block mb-4">
                    <span class="text-sm font-semibold text-slate-700 block mb-3">
                      Receipt Photo
                    </span>
                    <div class="space-y-3">
                      <button
                        id="selectBtn"
                        type="button"
                        class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-slate-900 text-white rounded-lg font-semibold hover:bg-slate-800 transition-colors"
                      >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Select from Device
                      </button>
                      <button
                        id="cameraBtn"
                        type="button"
                        class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-slate-100 text-slate-900 rounded-lg font-semibold hover:bg-slate-200 transition-colors border border-slate-300"
                      >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Capture with Camera
                      </button>
                    </div>
                    <input
                      id="fileInput"
                      type="file"
                      accept="image/*"
                      class="hidden"
                    />
                  </label>
                </div>

                <!-- Caption Input Section -->
                <div id="captionSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <label class="block">
                    <span class="text-sm font-semibold text-slate-700 block mb-3">
                      Caption Text
                    </span>
                    <textarea
                      id="captionInput"
                      placeholder="e.g., Farm supplies - seed corn"
                      maxlength="200"
                      class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent resize-none"
                      rows="3"
                    ></textarea>
                    <p class="text-xs text-slate-500 mt-2 text-right font-medium">
                      <span id="charCount">0</span> / 200
                    </p>
                  </label>
                  <button
                    id="clearImageBtn"
                    class="w-full mt-4 px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition-colors text-sm"
                  >
                    Clear & Start Over
                  </button>
                </div>

                <!-- Final Image Section -->
                <div id="finalImageSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <p class="text-sm font-semibold text-slate-700 block mb-4">
                    Final Image
                  </p>
                  <div class="bg-slate-50 rounded-lg overflow-hidden select-none" style="user-select: none; -webkit-user-select: none;">
                    <canvas
                      id="finalCanvas"
                      class="w-full h-auto"
                      style="user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;"
                    ></canvas>
                  </div>
                  <button
                    id="saveBtn"
                    class="w-full mt-4 px-4 py-3 bg-green-600 text-white rounded-lg font-semibold hover:bg-green-700 transition-colors flex items-center justify-center gap-2"
                  >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                    </svg>
                    Save Image
                  </button>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      attachEventListeners() {
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const captionInput = document.getElementById('captionInput');
        const clearImageBtn = document.getElementById('clearImageBtn');

        selectBtn.addEventListener('click', () => fileInput.click());

        cameraBtn.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.capture = 'environment';
          input.addEventListener('change', (e) => this.handleImageSelect(e));
          input.click();
        });

        fileInput.addEventListener('change', (e) => this.handleImageSelect(e));

        captionInput.addEventListener('input', (e) => {
          this.caption = e.target.value;
          document.getElementById('charCount').textContent = this.caption.length;
          this.updateFinalImage();
        });

        clearImageBtn.addEventListener('click', () => this.clearImage());

        const saveBtn = document.getElementById('saveBtn');
        saveBtn.addEventListener('click', () => this.saveImage());
      }

      handleImageSelect(e) {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            this.selectedImage = event.target.result;
            this.caption = '';
            this.updateUI();
            this.updateFinalImage();
          };
          reader.readAsDataURL(file);
        }
      }

      clearImage() {
        this.selectedImage = null;
        this.caption = '';
        document.getElementById('fileInput').value = '';
        this.updateUI();
      }

      updateUI() {
        const captionSection = document.getElementById('captionSection');
        const finalImageSection = document.getElementById('finalImageSection');
        const captionInput = document.getElementById('captionInput');
        const charCount = document.getElementById('charCount');

        if (this.selectedImage) {
          captionSection.classList.remove('hidden');
          captionInput.value = this.caption;
          charCount.textContent = this.caption.length;
        } else {
          captionSection.classList.add('hidden');
          finalImageSection.classList.add('hidden');
          captionInput.value = '';
          charCount.textContent = '0';
        }
      }

      updateFinalImage() {
        const finalImageSection = document.getElementById('finalImageSection');
        
        if (!this.selectedImage || !this.caption.trim()) {
          finalImageSection.classList.add('hidden');
          return;
        }

        finalImageSection.classList.remove('hidden');
        const canvas = document.getElementById('finalCanvas');
        const img = new Image();
        
        img.onload = () => {
          const ctx = canvas.getContext('2d');
          canvas.width = img.width;
          canvas.height = img.height;

          ctx.drawImage(img, 0, 0);

          const fontSize = Math.max(20, img.width / 20);
          const padding = Math.max(12, img.width / 40);
          const lineHeight = fontSize * 1.4;

          ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
          ctx.fillStyle = 'white';
          ctx.textAlign = 'left';

          const maxWidth = img.width - padding * 2;
          const words = this.caption.split(' ');
          const lines = [];
          let currentLine = '';

          words.forEach((word) => {
            const testLine = currentLine + (currentLine ? ' ' : '') + word;
            const metrics = ctx.measureText(testLine);
            if (metrics.width > maxWidth && currentLine) {
              lines.push(currentLine);
              currentLine = word;
            } else {
              currentLine = testLine;
            }
          });
          if (currentLine) lines.push(currentLine);

          const textBlockHeight = lines.length * lineHeight + padding * 2;
          const bgY = img.height - textBlockHeight;

          ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
          ctx.fillRect(0, bgY, img.width, textBlockHeight);

          ctx.fillStyle = 'white';
          lines.forEach((line, index) => {
            ctx.fillText(
              line,
              padding,
              bgY + padding + (index + 1) * lineHeight - (lineHeight - fontSize) / 2
            );
          });
        };
        
        img.src = this.selectedImage;
      }

      saveImage() {
        const canvas = document.getElementById('finalCanvas');
        canvas.toBlob((blob) => {
          if (blob) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `receipt-${Date.now()}.jpg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);

            this.clearImage();
          }
        }, 'image/jpeg', 0.95);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        new ReceiptCaptioner();
      });
    } else {
      new ReceiptCaptioner();
    }
  </script>
</body>
</html>
