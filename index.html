<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Receipt Captioner</title>
  <meta name="description" content="Add a caption to a photo on this device.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
    }
    #liveCanvas {
      display: block;
      max-width: 100%;
      height: auto;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    .status-line {
      margin: 0.75rem 0;
      font-size: 0.875rem;
      font-weight: 500;
      color: #475569;
    }
    .status-line.status-error { color: #dc2626; }
    .status-line[hidden] { display: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script>
    class ReceiptCaptioner {
      constructor() {
        this.selectedImage = null;
        this.caption = '';
        this.saving = false;
        this.readGeneration = 0;
        this.saveGeneration = 0;
        this.render();
        this.attachEventListeners();
      }

      setStatus(id, message, isError) {
        const el = document.getElementById(id);
        if (!el) return;
        el.textContent = message || '';
        el.hidden = !message;
        el.classList.toggle('status-error', Boolean(message) && isError);
        el.setAttribute('role', isError && message ? 'alert' : 'status');
        el.setAttribute('aria-live', isError && message ? 'assertive' : 'polite');
        if (message) el.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }

      setBusy(busy) {
        ['selectBtn', 'cameraBtn'].forEach((id) => {
          const btn = document.getElementById(id);
          if (!btn) return;
          btn.disabled = busy;
          btn.setAttribute('aria-busy', busy ? 'true' : 'false');
        });
        const fileInput = document.getElementById('fileInput');
        if (fileInput) fileInput.disabled = busy;
      }

      render() {
        const root = document.getElementById('root');
        root.innerHTML = `
          <div class="min-h-screen bg-gradient-to-br from-slate-50 to-slate-100">
            <!-- Header -->
            <div class="border-b border-slate-200 bg-white/50 backdrop-blur-sm sticky top-0 z-40">
              <div class="max-w-2xl mx-auto px-6 py-6">
                <h1 class="text-3xl font-bold text-slate-900 tracking-tight">
                  Receipt Captioner
                </h1>
                <p class="text-slate-600 mt-1 text-sm font-medium">
                  Add captions to your receipts
                </p>
              </div>
            </div>

            <!-- Main Content -->
            <div class="max-w-2xl mx-auto px-6 py-8 flex flex-col items-center">
              <div class="space-y-6 w-full max-w-md">
                <!-- Image Upload Section -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <label class="block mb-4">
                    <span class="text-sm font-semibold text-slate-700 block mb-3">
                      Receipt Photo
                    </span>
                    <div class="space-y-3">
                      <button
                        id="selectBtn"
                        type="button"
                        class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-slate-900 text-white rounded-lg font-semibold hover:bg-slate-800 transition-colors disabled:opacity-60"
                      >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                        </svg>
                        Select from Device
                      </button>
                      <button
                        id="cameraBtn"
                        type="button"
                        class="w-full flex items-center justify-center gap-3 px-4 py-3 bg-slate-100 text-slate-900 rounded-lg font-semibold hover:bg-slate-200 transition-colors border border-slate-300 disabled:opacity-60"
                      >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        </svg>
                        Capture with Camera
                      </button>
                    </div>
                    <p id="statusMessage" class="status-line" role="status" aria-live="polite" hidden></p>
                    <input
                      id="fileInput"
                      type="file"
                      accept="image/*"
                      class="hidden"
                      tabindex="-1"
                      aria-hidden="true"
                    />
                  </label>
                </div>

                <!-- Caption Input Section -->
                <div id="captionSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <label class="block">
                    <span class="text-sm font-semibold text-slate-700 block mb-3">
                      Caption Text
                    </span>
                    <textarea
                      id="captionInput"
                      placeholder="e.g., Farm supplies - seed corn"
                      maxlength="200"
                      class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-slate-900 focus:border-transparent resize-none"
                      rows="3"
                    ></textarea>
                    <p class="text-xs text-slate-500 mt-2 text-right font-medium">
                      <span id="charCount">0</span> / 200
                    </p>
                  </label>
                  <button
                    id="clearImageBtn"
                    type="button"
                    class="w-full mt-4 px-4 py-2 bg-red-500 text-white rounded-lg font-semibold hover:bg-red-600 transition-colors text-sm"
                  >
                    Clear & Start Over
                  </button>
                </div>

                <!-- Live Final Image Section -->
                <div id="finalImageSection" class="hidden bg-white rounded-xl shadow-sm border border-slate-200 p-6">
                  <p class="text-sm font-semibold text-slate-700 block mb-4">
                    Final Image
                  </p>
                  <p id="saveStatus" class="status-line" role="status" aria-live="polite" hidden></p>
                  <div class="bg-slate-50 rounded-lg overflow-hidden">
                    <canvas
                      id="liveCanvas"
                      class="w-full h-auto"
                      role="img"
                      aria-label="Preview of the photo with your caption"
                    ></canvas>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      attachEventListeners() {
        const fileInput = document.getElementById('fileInput');
        const selectBtn = document.getElementById('selectBtn');
        const cameraBtn = document.getElementById('cameraBtn');
        const captionInput = document.getElementById('captionInput');
        const clearImageBtn = document.getElementById('clearImageBtn');
        const liveCanvas = document.getElementById('liveCanvas');

        selectBtn.addEventListener('click', () => fileInput.click());

        cameraBtn.addEventListener('click', () => {
          const input = document.createElement('input');
          input.type = 'file';
          input.accept = 'image/*';
          input.capture = 'environment';
          input.addEventListener('change', (e) => this.handleImageSelect(e), { once: true });
          input.click();
        });

        fileInput.addEventListener('change', (e) => this.handleImageSelect(e));

        captionInput.addEventListener('input', (e) => {
          this.caption = e.target.value;
          document.getElementById('charCount').textContent = this.caption.length;
          this.updateLiveImage();
        });

        clearImageBtn.addEventListener('click', () => this.clearImage());

        // Long press to save
        liveCanvas.addEventListener('contextmenu', (e) => {
          e.preventDefault();
          this.saveImage();
        });

        // Touch long press for mobile
        let longPressTimer;
        liveCanvas.addEventListener('touchstart', () => {
          longPressTimer = setTimeout(() => {
            this.saveImage();
          }, 500);
        });

        liveCanvas.addEventListener('touchend', () => {
          clearTimeout(longPressTimer);
        });

        liveCanvas.addEventListener('touchmove', () => {
          clearTimeout(longPressTimer);
        });
      }

      handleImageSelect(e) {
        const file = e.target.files?.[0];
        if (!file) return;

        const generation = ++this.readGeneration;
        const fail = (message) => {
          if (generation !== this.readGeneration) return;
          e.target.value = '';
          this.setBusy(false);
          this.setStatus('statusMessage', message, true);
        };

        if (!file.type || !file.type.startsWith('image/')) {
          fail('That file is not a photo. Choose an image.');
          return;
        }

        this.setBusy(true);
        this.setStatus('statusMessage', 'Reading photo…', false);

        const reader = new FileReader();
        reader.onload = (event) => {
          if (generation !== this.readGeneration) return;
          const result = event.target && event.target.result;
          if (typeof result !== 'string' || !result) {
            fail('Could not read that photo. Try another file.');
            return;
          }
          const img = new Image();
          img.onload = () => {
            if (generation !== this.readGeneration) return;
            this.selectedImage = result;
            this.caption = '';
            this.setBusy(false);
            this.setStatus('statusMessage', '', false);
            this.updateUI();
            this.updateLiveImage();
          };
          img.onerror = () => {
            fail('Could not open that photo. Try another file.');
          };
          img.src = result;
        };
        reader.onerror = () => {
          fail('Could not read that photo. Try another file.');
        };
        reader.readAsDataURL(file);
      }

      clearImage() {
        this.readGeneration += 1;
        this.saveGeneration += 1;
        this.saving = false;
        this.selectedImage = null;
        this.caption = '';
        const fileInput = document.getElementById('fileInput');
        if (fileInput) fileInput.value = '';
        this.setBusy(false);
        this.setStatus('statusMessage', '', false);
        this.setStatus('saveStatus', '', false);
        this.updateUI();
      }

      updateUI() {
        const captionSection = document.getElementById('captionSection');
        const finalImageSection = document.getElementById('finalImageSection');
        const captionInput = document.getElementById('captionInput');
        const charCount = document.getElementById('charCount');

        if (this.selectedImage) {
          captionSection.classList.remove('hidden');
          captionInput.value = this.caption;
          charCount.textContent = this.caption.length;
        } else {
          captionSection.classList.add('hidden');
          finalImageSection.classList.add('hidden');
          captionInput.value = '';
          charCount.textContent = '0';
        }
      }

      drawCaptionOnCanvas(ctx, img, canvas) {
        canvas.width = img.width;
        canvas.height = img.height;

        ctx.drawImage(img, 0, 0);

        const fontSize = Math.max(20, img.width / 20);
        const padding = Math.max(12, img.width / 40);
        const lineHeight = fontSize * 1.4;

        ctx.font = `bold ${fontSize}px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif`;
        ctx.textAlign = 'left';

        const maxWidth = img.width - padding * 2;
        const words = this.caption.split(' ');
        const lines = [];
        let currentLine = '';

        words.forEach((word) => {
          const testLine = currentLine + (currentLine ? ' ' : '') + word;
          const metrics = ctx.measureText(testLine);
          if (metrics.width > maxWidth && currentLine) {
            lines.push(currentLine);
            currentLine = word;
          } else {
            currentLine = testLine;
          }
        });
        if (currentLine) lines.push(currentLine);

        const textBlockHeight = lines.length * lineHeight + padding * 2;

        // Draw at TOP of image
        ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        ctx.fillRect(0, 0, img.width, textBlockHeight);

        ctx.fillStyle = 'white';
        lines.forEach((line, index) => {
          ctx.fillText(
            line,
            padding,
            padding + (index + 1) * lineHeight - (lineHeight - fontSize) / 2
          );
        });
      }

      updateLiveImage() {
        const finalImageSection = document.getElementById('finalImageSection');
        
        if (!this.selectedImage || !this.caption.trim()) {
          finalImageSection.classList.add('hidden');
          return;
        }

        finalImageSection.classList.remove('hidden');
        const canvas = document.getElementById('liveCanvas');
        const img = new Image();

        img.onload = () => {
          const ctx = canvas.getContext('2d');
          if (!ctx) {
            finalImageSection.classList.add('hidden');
            this.setStatus('statusMessage', 'Could not open that photo. Try another file.', true);
            return;
          }
          this.drawCaptionOnCanvas(ctx, img, canvas);
        };
        img.onerror = () => {
          finalImageSection.classList.add('hidden');
          this.setStatus('statusMessage', 'Could not open that photo. Try another file.', true);
        };

        img.src = this.selectedImage;
      }

      saveImage() {
        if (!this.selectedImage || !this.caption.trim() || this.saving) return;

        this.saving = true;
        const generation = ++this.saveGeneration;
        let settled = false;
        const current = () => this.saveGeneration === generation && !settled;
        const finishError = () => {
          if (!current()) return;
          settled = true;
          this.saving = false;
          try {
            this.setStatus('saveStatus', 'Could not save the image.', true);
          } catch (e) {
            // The lock is already released. A status update must not keep save stuck.
          }
        };
        const finishSuccess = () => {
          if (!current()) return;
          settled = true;
          this.clearImage();
        };

        try {
          this.setStatus('saveStatus', 'Saving image…', false);
          const canvas = document.createElement('canvas');
          const img = new Image();

          img.onload = () => {
            if (!current()) return;
            try {
              const ctx = canvas.getContext('2d');
              if (!ctx) {
                finishError();
                return;
              }
              this.drawCaptionOnCanvas(ctx, img, canvas);
              canvas.toBlob((blob) => {
                if (!current()) return;
                try {
                  if (!blob) {
                    finishError();
                    return;
                  }
                  const url = URL.createObjectURL(blob);
                  const link = document.createElement('a');
                  link.href = url;
                  link.download = `receipt-${Date.now()}.jpg`;
                  document.body.appendChild(link);
                  link.click();
                  document.body.removeChild(link);
                  URL.revokeObjectURL(url);
                  finishSuccess();
                } catch (e) {
                  finishError();
                }
              }, 'image/jpeg', 0.95);
            } catch (e) {
              finishError();
            }
          };
          img.onerror = () => finishError();
          img.src = this.selectedImage;
        } catch (e) {
          finishError();
        }
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => {
        new ReceiptCaptioner();
      });
    } else {
      new ReceiptCaptioner();
    }
  </script>
</body>
</html>
